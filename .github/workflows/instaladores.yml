name: Gerar instaladores (IPA iOS e APK Android)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: instaladores-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: IPA iOS (sem assinatura)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar projeto nativo iOS
        run: npx expo prebuild --platform ios --clean

      - name: Compilar (Release, sem assinatura)
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "Workspace: $WORKSPACE / Scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | tail -n 100
          test -d "$RUNNER_TEMP/app.xcarchive/Products/Applications"

      - name: Empacotar IPA
        run: |
          mkdir -p "$RUNNER_TEMP/out/Payload"
          cp -R "$RUNNER_TEMP/app.xcarchive/Products/Applications/"*.app "$RUNNER_TEMP/out/Payload/"
          cd "$RUNNER_TEMP/out"
          zip -qr controles-gastos-ml.ipa Payload
          ls -lh controles-gastos-ml.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: controles-gastos-ml-ipa
          path: ${{ runner.temp }}/out/controles-gastos-ml.ipa
          retention-days: 30

  build-apk:
    name: APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependências
        run: npm ci

      - name: Gerar projeto nativo Android
        run: npx expo prebuild --platform android --clean

      # O template do Expo assina o release com a chave de debug que vem no projeto,
      # o que gera um APK instalável direto no celular (fora da Play Store).
      - name: Compilar APK (Release)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/controles-gastos-ml.apk"
          ls -lh "$RUNNER_TEMP/controles-gastos-ml.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: controles-gastos-ml-apk
          path: ${{ runner.temp }}/controles-gastos-ml.apk
          retention-days: 30

  # Publica os instaladores numa Release (download direto do .apk/.ipa, sem .zip)
  release:
    name: Publicar Release
    needs: [build-ipa, build-apk]
    if: ${{ !cancelled() && (needs.build-apk.result == 'success' || needs.build-ipa.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Instaladores gerados a partir do commit ${{ github.sha }}.
            - **Android:** baixe `controles-gastos-ml.apk` no celular e abra para instalar.
            - **iPhone:** baixe `controles-gastos-ml.ipa` no computador e instale pelo Sideloadly.
          files: dist/*
          fail_on_unmatched_files: false
