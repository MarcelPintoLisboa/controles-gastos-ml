name: Gerar instaladores (IPA iOS e APK Android)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: instaladores-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # IPA: tenta primeiro no Mac ARM; se o GitHub não tiver máquina livre (ou falhar),
  # tenta de novo automaticamente num Mac Intel.
  build-ipa:
    uses: ./.github/workflows/ipa.yml
    with:
      runner: macos-15

  build-ipa-retry:
    needs: build-ipa
    if: ${{ !cancelled() && needs.build-ipa.result != 'success' }}
    uses: ./.github/workflows/ipa.yml
    with:
      runner: macos-15-intel

  build-apk:
    name: APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependências
        run: npm ci

      - name: Gerar projeto nativo Android
        run: npx expo prebuild --platform android --clean

      # O React Native pede uma versão específica do NDK. Se a máquina do GitHub não tiver,
      # o Gradle tenta baixar sozinho e às vezes recebe um arquivo corrompido. Aqui o NDK é
      # instalado antes (com cache e novas tentativas) para o build não depender disso.
      - name: Descobrir versão do NDK
        id: ndk
        run: |
          V=$(grep -oE 'ndkVersion\s*=\s*"[0-9.]+"' android/build.gradle | grep -oE '[0-9.]+' | head -n 1)
          V=${V:-26.1.10909125}
          echo "Versão do NDK: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Cache do NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/${{ steps.ndk.outputs.version }}
          key: ndk-${{ runner.os }}-${{ steps.ndk.outputs.version }}

      - name: Instalar NDK
        run: |
          V=${{ steps.ndk.outputs.version }}
          if [ -f "$ANDROID_HOME/ndk/$V/source.properties" ]; then echo "NDK $V já disponível"; exit 0; fi
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for i in 1 2 3; do
            rm -rf "$ANDROID_HOME/ndk/$V"
            yes | "$SDKM" --install "ndk;$V" > /dev/null && [ -f "$ANDROID_HOME/ndk/$V/source.properties" ] && break
            echo "Tentativa $i falhou, tentando de novo..."; sleep 20
          done
          test -f "$ANDROID_HOME/ndk/$V/source.properties"

      # O template do Expo assina o release com a chave de debug que vem no projeto,
      # o que gera um APK instalável direto no celular (fora da Play Store).
      - name: Compilar APK (Release)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/controles-gastos-ml.apk"
          ls -lh "$RUNNER_TEMP/controles-gastos-ml.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: controles-gastos-ml-apk
          path: ${{ runner.temp }}/controles-gastos-ml.apk
          retention-days: 30

  # Publica os instaladores numa Release (download direto do .apk/.ipa, sem .zip)
  release:
    name: Publicar Release
    needs: [build-ipa, build-ipa-retry, build-apk]
    if: ${{ !cancelled() && (needs.build-apk.result == 'success' || needs.build-ipa.result == 'success' || needs.build-ipa-retry.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Instaladores gerados a partir do commit ${{ github.sha }}.
            - **Android:** baixe `controles-gastos-ml.apk` no celular e abra para instalar.
            - **iPhone:** baixe `controles-gastos-ml.ipa` no computador e instale pelo Sideloadly.
          files: dist/*
          fail_on_unmatched_files: false
