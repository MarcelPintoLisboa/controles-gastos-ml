name: iOS - gerar IPA

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'scripts/**', '.cursorrules', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      runner:
        description: 'Máquina macOS (use macos-15-intel se a ARM estiver sem capacidade)'
        type: choice
        options: [macos-15, macos-15-intel]
        default: macos-15

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: IPA iOS (sem assinatura)
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 45
    permissions:
      contents: write # para publicar a Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar projeto nativo iOS
        run: npx expo prebuild --platform ios --clean

      # O log completo do xcodebuild vai para um arquivo; na tela aparecem só erros e o
      # resultado final. Se falhar, o log completo fica disponível como artefato.
      - name: Compilar (Release, sem assinatura)
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "Workspace: $WORKSPACE / Scheme: $SCHEME"
          set +e
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > "$RUNNER_TEMP/xcodebuild.log" 2>&1
          STATUS=$?
          set -e
          echo "---- erros encontrados (se houver) ----"
          grep -E "error:" "$RUNNER_TEMP/xcodebuild.log" | head -n 50 || true
          echo "---- final do log ----"
          tail -n 30 "$RUNNER_TEMP/xcodebuild.log"
          [ "$STATUS" -eq 0 ] || exit "$STATUS"
          test -d "$RUNNER_TEMP/app.xcarchive/Products/Applications"

      - name: Log do xcodebuild (em caso de erro)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 7

      - name: Empacotar IPA
        run: |
          mkdir -p "$RUNNER_TEMP/out/Payload"
          cp -R "$RUNNER_TEMP/app.xcarchive/Products/Applications/"*.app "$RUNNER_TEMP/out/Payload/"
          cd "$RUNNER_TEMP/out"
          zip -qr controles-gastos-ml.ipa Payload
          ls -lh controles-gastos-ml.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: controles-gastos-ml-ipa
          path: ${{ runner.temp }}/out/controles-gastos-ml.ipa
          retention-days: 30

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-${{ github.run_number }}
          name: iOS ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            IPA (sem assinatura) gerado a partir do commit ${{ github.sha }}.
            Baixe `controles-gastos-ml.ipa` no computador e instale pelo Sideloadly
            (ou rode `npm run baixar` no projeto).
          files: ${{ runner.temp }}/out/controles-gastos-ml.ipa
