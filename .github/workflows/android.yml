name: Android - gerar APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'scripts/**', '.cursorrules', '.github/workflows/ios.yml']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # para publicar a Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependências
        run: npm ci

      - name: Gerar projeto nativo Android
        run: npx expo prebuild --platform android --clean

      # O React Native pede uma versão específica do NDK. Se a máquina do GitHub não tiver,
      # o Gradle tenta baixar sozinho e às vezes recebe um arquivo corrompido. Aqui o NDK é
      # instalado antes (com cache e novas tentativas) para o build não depender disso.
      - name: Descobrir versão do NDK
        id: ndk
        run: |
          V=$(grep -oE 'ndkVersion\s*=\s*"[0-9.]+"' android/build.gradle | grep -oE '[0-9.]+' | head -n 1)
          V=${V:-26.1.10909125}
          echo "Versão do NDK: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Cache do NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/${{ steps.ndk.outputs.version }}
          key: ndk-${{ runner.os }}-${{ steps.ndk.outputs.version }}

      - name: Instalar NDK
        run: |
          V=${{ steps.ndk.outputs.version }}
          if [ -f "$ANDROID_HOME/ndk/$V/source.properties" ]; then echo "NDK $V já disponível"; exit 0; fi
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for i in 1 2 3; do
            rm -rf "$ANDROID_HOME/ndk/$V"
            yes | "$SDKM" --install "ndk;$V" > /dev/null && [ -f "$ANDROID_HOME/ndk/$V/source.properties" ] && break
            echo "Tentativa $i falhou, tentando de novo..."; sleep 20
          done
          test -f "$ANDROID_HOME/ndk/$V/source.properties"

      # Assinatura: usa a chave própria do app guardada nos segredos do repositório.
      # Sem os segredos, cai na chave pública de debug do template (o Play Protect
      # costuma travar a instalação desses APKs), e o log avisa.
      # Arquiteturas: só as de celular (arm64 e armv7); x86 serve só para emulador.
      - name: Compilar APK (Release)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cd android
          chmod +x gradlew
          ASSINATURA=()
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            ASSINATURA=(
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore"
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD"
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS"
              -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"
            )
            echo "Assinando com a chave própria do app."
          else
            echo "::warning::Segredos ANDROID_KEYSTORE_* não configurados: APK assinado com a chave de debug (o Play Protect pode travar a instalação)."
          fi
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            "${ASSINATURA[@]}" \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
          rm -f "$RUNNER_TEMP/release.keystore"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/controles-gastos-ml.apk"
          ls -lh "$RUNNER_TEMP/controles-gastos-ml.apk"

      - name: Conferir APK (assinatura e arquiteturas)
        run: |
          APK="$RUNNER_TEMP/controles-gastos-ml.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BT/apksigner" verify --print-certs "$APK" | grep -E "certificate DN|SHA-256"
          echo "Arquiteturas: $(unzip -l "$APK" | awk '{print $4}' | grep '^lib/' | cut -d/ -f2 | sort -u | tr '\n' ' ')"
          "$BT/aapt" dump badging "$APK" | grep -E "^package|sdkVersion|targetSdkVersion"

      - uses: actions/upload-artifact@v4
        with:
          name: controles-gastos-ml-apk
          path: ${{ runner.temp }}/controles-gastos-ml.apk
          retention-days: 30

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Android ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            APK gerado a partir do commit ${{ github.sha }}.
            Baixe `controles-gastos-ml.apk` no celular e abra para instalar
            (ou rode `npm run baixar` no projeto).
          files: ${{ runner.temp }}/controles-gastos-ml.apk
